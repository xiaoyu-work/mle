name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            machine: 0x8664
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            machine: 0xAA64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable-${{ matrix.target }} --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable-${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }

      - name: Build portable app
        run: .\tools\package.ps1

      - name: Verify portable package
        run: |
          $required = @('mle.exe', 'data\dictionary.db', 'licenses\ECDICT.txt', 'README.md', 'LICENSE')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath "dist\MLE\$file" -PathType Leaf)) {
              throw "Missing package file: $file"
            }
          }
          $exe = [IO.File]::ReadAllBytes('dist\MLE\mle.exe')
          $peOffset = [BitConverter]::ToInt32($exe, 0x3c)
          $machine = [BitConverter]::ToUInt16($exe, $peOffset + 4)
          if ($machine -ne ${{ matrix.machine }}) {
            throw "Incorrect executable architecture: $machine"
          }

      - name: Install Inno Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw 'Inno Setup checksum mismatch.'
          }
          $process = Start-Process $setup -ArgumentList '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build Windows installer
        run: .\tools\build_installer.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MLE-windows-${{ matrix.arch }}-setup
          path: dist\installers\*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 30
